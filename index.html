<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quản lý Thi đua Lớp học</title>
    <meta name="description" content="Ứng dụng web quản lý thi đua và báo cáo lớp học dành cho học sinh, ban cán sự và giáo viên." />
    <meta property="og:title" content="Quản lý Thi đua Lớp học" />
    <meta property="og:description" content="Ứng dụng web quản lý thi đua và báo cáo lớp học dành cho học sinh, ban cán sự và giáo viên." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F6F3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GSI) - Vietnamese Locale -->
    <script src="https://accounts.google.com/gsi/client?hl=vi" async defer></script>
    <script>
      (function() {
        try {
          localStorage.setItem('app_theme', 'light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
