<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quản lý Nề nếp &amp; Thi đua Lớp học</title>
    <meta name="description" content="Ứng dụng web quản lý nề nếp, thi đua và báo cáo lớp học dành cho học sinh, ban cán sự và giáo viên." />
    <meta property="og:title" content="Quản lý Nề nếp &amp; Thi đua Lớp học" />
    <meta property="og:description" content="Ứng dụng web quản lý nề nếp, thi đua và báo cáo lớp học dành cho học sinh, ban cán sự và giáo viên." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          var theme = saved || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
